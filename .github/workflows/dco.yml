name: DCO

on:
  pull_request:
    branches: [main, 'release/*']

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    steps:
      - name: Check all commits for Signed-off-by
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Merge commits (more than one parent) are exempt, matching standard DCO practice.
          missing=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits" --paginate \
            --jq '.[] | select(.parents | length == 1) | select(.commit.message | test("(\\n|^)Signed-off-by: .+ <.+@.+>") | not) | .sha[0:7] + " " + (.commit.message | split("\n")[0])')
          if [ -n "$missing" ]; then
            echo "The following commits are missing a Signed-off-by line:"
            echo "$missing"
            echo ""
            echo "Sign off new commits with 'git commit -s'. To fix the commits on this branch, run:"
            echo "  git rebase --signoff origin/main && git push --force-with-lease"
            echo "See CONTRIBUTING.md, section 'Developer Certificate of Origin'."
            exit 1
          fi
          echo "All commits are signed off."
